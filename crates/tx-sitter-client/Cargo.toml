[package]
name = "tx-sitter-client"
version = "0.1.0"
authors = ["OpenAPI Generator team and contributors"]
description = "A transaction relayer service!  ## Operating a relayer Networks, relayers and API keys are defined in the service's config, see the README. A relayer accepts exactly the API keys whose hashes its config lists.  ## Using an API key The v2 endpoints take the API key as a bearer token, `Authorization: Bearer <api key>`. For example, `POST /2/tx` sends a transaction.  The v1 endpoints take it in the path instead, for example `POST /1/api/:api_token/tx`. "
# Override this license by providing a License Object in the OpenAPI.
license = "Unlicense"
edition = "2021"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
base-api-types = { path = "../base-api-types" }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
uuid = { version = "^1.8", features = ["serde", "v4"] }
reqwest = { version = "^0.12", features = ["json", "multipart"] }
reqwest-middleware = { version = "^0.3", features = ["json", "multipart"] }

