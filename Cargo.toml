[package]
name = "tx-sitter"
version = "0.1.0"
edition = "2021"
default-run = "tx-sitter"
license-file = "LICENSE"

[workspace]
members = ["crates/*"]

[dependencies]
## AWS
aws-config = { version = "1.4.0", features = ["behavior-version-latest"] }
aws-sdk-kms = "1.26.0"
aws-smithy-runtime-api = "1.6.0"

# Internal
postgres-docker-utils = { path = "crates/postgres-docker-utils" }
base-api-types = { path = "crates/base-api-types" }
tx-sitter-client = { path = "crates/tx-sitter-client" }

# Company
telemetry-batteries = { git = "https://github.com/worldcoin/telemetry-batteries", rev = "1b11fa889e9fea6513f474aa968948fb0b386b4e" }

## External
alloy = { version = "1.8.3", default-features = false, features = [
    "std",
    "consensus",
    "eips",
    "network",
    "provider-http",
    "provider-ws",
    "reqwest-rustls-tls",
    "rpc-types",
    "serde",
    "signer-aws",
    "signer-local",
] }
async-trait = "0.1.74"
base64 = "0.21.5"
bigdecimal = "0.4.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.3.0", features = ["env", "derive"] }
config = "0.13.3"
dotenv = "0.15.0"
eyre = "0.6.3"
color-eyre = "0.6.3"
futures = "0.3"
hex = "0.4.3"
hex-literal = "0.4.1"
humantime = "2.1.0"
humantime-serde = "1.1.1"
hyper = "0.14.27"
itertools = "0.12.0"
metrics = "0.23.0"
num-bigint = "0.4.4"
poem = { version = "3", features = ["eyre06"] }
poem-openapi = { version = "5", features = [
    "chrono",
    "openapi-explorer",
    "rapidoc",
    "redoc",
    "swagger-ui",
] }
rand = "0.8.5"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
serde = "1.0.136"
serde_json = { version = "1.0.91", features = ["raw_value"] }
sha3 = "0.10.8"
sqlx = { version = "0.7.2", features = [
    "time",
    "chrono",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "bigdecimal",
] }
strum = { version = "0.25.0", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7.10"
toml = "0.8.8"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "std",
    "fmt",
    "json",
    "ansi",
] }
tracing-error = "0.2.0"
url = "2.4.1"
uuid = { version = "0.8", features = ["v4"] }
version = "3.0.0"
webpki-root-certs = "1.0.12"

[dev-dependencies]
alloy = { version = "1.8.3", default-features = false, features = [
    "node-bindings",
    "provider-anvil-api",
] }
indoc = "2.0.3"
test-case = "3.1.0"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.28"

[features]
default = ["default-config"]
default-config = []

[profile.release]
panic = "abort"
